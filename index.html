<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>HireReady — AI Career Preparation Platform (Demo)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <style>
      :root{
        --navy:#182C46; --navy2:#2D4D6C; --steel:#88B3C5; --paper:#F5F3ED; --coral:#EF7466; --coral-d:#DB5B4D;
        --bg:#F5F3ED; --bg2:#FFFFFF; --card:#FFFFFF; --card2:#F5F3ED; --card3:#DFE9EC;
        --line:#DED8C8; --line2:#C6BCA3;
        --text:#182C46; --muted:#51687E; --muted2:#8496A6;
        --accent:#EF7466; --accent-d:#DB5B4D; --violet:#2D4D6C;
        --good:#2F9E6E; --warn:#C07F14; --bad:#D24936;
        --radius:14px;
        --shadow:0 18px 44px rgba(24,44,70,.16);
        color-scheme:light;
      }
      *{box-sizing:border-box}
      html{scroll-behavior:smooth}
      body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
      h1,h2,h3,h4{font-family:"IBM Plex Sans",sans-serif;margin:0;line-height:1.15;letter-spacing:-.015em;font-weight:700}
      p{margin:0}
      a{color:var(--navy2);text-decoration:none;font-weight:600}
      a:hover{text-decoration:underline}
      button,[role="button"],select,summary,input:not([type="checkbox"]){min-height:2.25rem}
      button{font-family:inherit;cursor:pointer}
      input,select,textarea{font-family:inherit;font-size:15px;color:var(--text);background:#fff;border:1px solid var(--line2);border-radius:10px;padding:.6rem .8rem;width:100%}
      input:focus,select:focus,textarea:focus{outline:2px solid var(--coral);outline-offset:1px;border-color:transparent}
      textarea{resize:vertical;line-height:1.5}
      label{font-size:.82rem;font-weight:700;color:var(--muted);display:block;margin-bottom:.35rem;letter-spacing:.02em}
      ::placeholder{color:var(--muted2)}
      .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
      .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:1px solid transparent;border-radius:11px;padding:.62rem 1.15rem;font-weight:700;font-size:.95rem;transition:background .15s,border-color .15s,color .15s,transform .1s;white-space:nowrap;text-decoration:none}
      .btn:hover{text-decoration:none}
      .btn:active{transform:translateY(1px)}
      .btn-primary{background:var(--coral);color:#fff}
      .btn-primary:hover{background:var(--coral-d);color:#fff}
      .btn-ghost{background:transparent;color:var(--navy);border-color:var(--navy2)}
      .btn-ghost:hover{background:var(--navy);border-color:var(--navy);color:#fff}
      .btn-soft{background:var(--card3);color:var(--navy)}
      .btn-soft:hover{background:#CBDCE2}
      .btn-danger{background:transparent;border-color:#E3A298;color:var(--bad)}
      .btn-danger:hover{background:#FDECE9}
      .btn-sm{padding:.4rem .8rem;font-size:.85rem;min-height:2.25rem}
      .btn[disabled]{opacity:.45;cursor:not-allowed}
      .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 2px 10px rgba(24,44,70,.05)}
      .card h3{font-size:1.02rem}
      .chip{display:inline-flex;align-items:center;gap:.3rem;background:var(--card2);border:1px solid var(--line);color:var(--navy);border-radius:999px;padding:.22rem .65rem;font-size:.78rem;font-weight:600}
      .chip.blue{background:#E1EDF1;border-color:#B4CFDA;color:var(--navy2)}
      .chip.green{background:#E0F2E8;border-color:#A5D6BC;color:#1E7A4C}
      .chip.amber{background:#FAF0D7;border-color:#E8CF92;color:#8A5E0B}
      .chip.red{background:#FCE8E4;border-color:#F0AFA3;color:#A83224}
      .badge-sample{display:inline-flex;align-items:center;background:#FAF0D7;border:1px solid #E3C87E;color:#8A5E0B;border-radius:6px;padding:.08rem .45rem;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;vertical-align:middle}
      .muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.76rem}
      .grid{display:grid;gap:16px}
      .bar{height:9px;background:#EDE9DC;border:1px solid var(--line);border-radius:99px;overflow:hidden}
      .bar>i{display:block;height:100%;border-radius:99px;background:var(--navy2);transition:width .5s ease}
      .bar>i.good{background:var(--good)} .bar>i.warn{background:#E3A93C} .bar>i.bad{background:var(--bad)}
      .bar>i.steel{background:var(--steel)} .bar>i.coral{background:var(--coral)}
      .score-ring{position:relative;width:132px;height:132px;flex:none}
      .score-ring svg{transform:rotate(-90deg)}
      .score-ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
      .score-ring .num b{font-family:"IBM Plex Sans";font-size:1.9rem;line-height:1;color:var(--navy)}
      .score-ring .num span{font-size:.68rem;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
      .tag-row{display:flex;flex-wrap:wrap;gap:.4rem}
      .divider{height:1px;background:var(--line);margin:16px 0}
      .empty{border:1.5px dashed var(--line2);border-radius:var(--radius);padding:28px;text-align:center;color:var(--muted);background:#fff}
      .list-clean{list-style:none;margin:0;padding:0}
      .list-clean li{padding:.45rem 0 .45rem 1.4rem;position:relative}
      .list-clean li::before{content:"";position:absolute;left:.15rem;top:.95rem;width:6px;height:6px;border-radius:50%;background:var(--coral)}
      .list-clean li.good::before{background:var(--good)} .list-clean li.warn::before{background:#E3A93C} .list-clean li.bad::before{background:var(--bad)}
      .kbd{font-family:"IBM Plex Mono",monospace;font-size:.8em;background:var(--card2);border:1px solid var(--line2);border-radius:6px;padding:.05rem .4rem;color:var(--navy)}

      /* ---------- Landing ---------- */
      .topbar{position:sticky;top:0;z-index:40;background:rgba(245,243,237,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
      .topbar-in{display:flex;align-items:center;gap:14px;height:64px}
      .logo{display:flex;align-items:center;gap:.6rem;font-family:"IBM Plex Sans";font-weight:700;font-size:1.12rem;color:var(--navy);letter-spacing:-.01em}
      .logo:hover{text-decoration:none}
      .logo-mark{width:32px;height:32px;border-radius:9px;background:var(--coral);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
      .topbar nav{display:flex;gap:4px;margin-left:auto;align-items:center}
      .topbar nav a{color:var(--navy2);font-weight:600;font-size:.95rem;padding:.5rem .75rem;border-radius:8px}
      .topbar nav a:hover{color:var(--navy);background:#EAE6D9;text-decoration:none}
      .hero-band{background:var(--navy);color:#fff}
      .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:52px;align-items:center;padding:68px 0 58px;text-align:left}
      .hero h1{font-size:clamp(2.3rem,5vw,3.6rem);font-weight:700;line-height:1.08;color:#fff}
      .hero h1 .l1{display:block;color:#fff}
      .hero h1 .l2{display:block;color:var(--steel)}
      .hero p.lede{color:#C3D5DF;font-size:1.1rem;max-width:52ch;margin-top:18px}
      .hero-cta{display:flex;gap:18px;flex-wrap:wrap;margin-top:28px;align-items:center}
      .hero-link{color:#fff;font-weight:700;font-size:.98rem;display:inline-flex;align-items:center;gap:.4rem}
      .hero-link:hover{color:var(--steel);text-decoration:none}
      .hero-stats{display:flex;gap:34px;flex-wrap:wrap;margin-top:42px}
      .hero-stats b{font-family:"IBM Plex Sans";font-size:1.45rem;display:block;color:#fff}
      .hero-stats span{color:var(--steel);font-size:.85rem}
      .opp-card{background:#fff;color:var(--navy);border-radius:20px;padding:26px;box-shadow:0 24px 50px rgba(0,0,0,.28)}
      .opp-card h3{font-size:1.05rem;display:flex;align-items:center;gap:.5rem}
      .opp-card .opp-sub{color:var(--muted);font-size:.87rem;margin-top:3px}
      .opp-top{display:flex;gap:22px;align-items:center;margin-top:20px}
      .opp-ring{position:relative;width:118px;height:118px;flex:none}
      .opp-ring svg{transform:rotate(-90deg)}
      .opp-ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
      .opp-ring .num b{font-size:1.65rem;line-height:1;color:var(--navy)}
      .opp-ring .num span{font-size:.64rem;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
      .opp-bars{flex:1;min-width:170px;display:grid;gap:13px}
      .opp-bar-row .opp-bar-head{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;font-weight:600;color:var(--navy);margin-bottom:5px}
      .opp-bar-row .opp-bar-head span:last-child{color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:.8rem}
      .opp-foot{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;font-size:.87rem;color:var(--muted)}
      .opp-foot b{color:var(--navy)}
      .feat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin:26px 0 8px}
      .feat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 2px 10px rgba(24,44,70,.05)}
      .feat .ic{width:42px;height:42px;border-radius:11px;background:#E1EDF1;color:var(--navy2);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
      .feat h3{font-size:1rem;margin-bottom:6px}
      .feat p{color:var(--muted);font-size:.9rem}
      .flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
      .flow .step{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:.88rem;box-shadow:0 2px 8px rgba(24,44,70,.04)}
      .flow .step b{display:block;font-family:"IBM Plex Sans";color:var(--coral-d);font-size:.8rem;letter-spacing:.06em;margin-bottom:4px}
      section.block{padding:38px 0}
      section.block h2{font-size:1.55rem;margin-bottom:8px;color:var(--navy)}
      section.block .sub{color:var(--muted);max-width:64ch}
      .role-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 2px 10px rgba(24,44,70,.05)}
      .role-card .role-head{display:flex;align-items:flex-start;gap:12px}
      .role-card .role-head h3{font-size:1.08rem;flex:1}
      .role-arrow{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;border:0;transition:background .15s}
      .role-arrow:hover{background:var(--coral)}
      footer.site{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--muted2);font-size:.85rem;margin-top:30px}

      /* ---------- Auth ---------- */
      .auth-wrap{max-width:460px;margin:44px auto 60px;padding:0 20px}
      .auth-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}
      .role-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:20px}
      .role-tabs button{background:transparent;border:0;color:var(--muted);border-radius:9px;font-weight:700;padding:.55rem}
      .role-tabs button.on{background:var(--navy);color:#fff}
      .mode-tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:18px}
      .mode-tabs button{background:none;border:0;color:var(--muted);font-weight:700;padding:.5rem .1rem;border-bottom:2px solid transparent;border-radius:0}
      .mode-tabs button.on{color:var(--navy);border-bottom-color:var(--coral)}
      .field{margin-bottom:14px}
      .form-err{background:#FCE8E4;border:1px solid #EFA295;color:#A83224;border-radius:10px;padding:.6rem .8rem;font-size:.88rem;margin-bottom:14px;display:none}
      .form-ok{background:#E0F2E8;border:1px solid #8FCBA9;color:#1E7A4C;border-radius:10px;padding:.6rem .8rem;font-size:.88rem;margin-bottom:14px;display:none}
      .demo-creds{background:var(--card2);border:1px dashed var(--line2);border-radius:12px;padding:12px 14px;font-size:.85rem;color:var(--muted);margin-top:18px}
      .demo-creds button{margin-top:8px}
      .auth-card form{margin:0}
      .auth-card input{font-size:16px}

      /* ---------- App shell ---------- */
      .shell{display:flex;min-height:100vh}
      .side{width:248px;flex:none;background:var(--navy);color:#EAF2F6;padding:18px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
      .side .logo{padding:2px 8px 16px;color:#fff}
      .side .muted{color:#9FB8C7}
      .side-label{font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);padding:14px 10px 6px}
      .nav-item{display:flex;align-items:center;gap:.65rem;padding:.58rem .7rem;border-radius:10px;color:#B7C9D6;font-weight:600;font-size:.93rem;border:0;background:none;width:100%;text-align:left;min-height:2.6rem}
      .nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
      .nav-item.on{background:rgba(239,116,102,.24);color:#fff}
      .nav-item svg{flex:none}
      .side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.15);padding-top:12px}
      .user-chip{display:flex;gap:.6rem;align-items:center;padding:6px 8px}
      .avatar{width:36px;height:36px;border-radius:50%;background:var(--navy2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex:none}
      .side .avatar{background:var(--steel);color:var(--navy)}
      .avatar.blue{background:var(--coral)}
      .main{flex:1;min-width:0;padding:26px 28px 90px;background:var(--bg)}
      .page-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:20px}
      .page-head h2{font-size:1.5rem;color:var(--navy)}
      .page-head .sub{color:var(--muted);margin-top:3px;max-width:70ch}
      .page-head .sp{flex:1}
      .mobile-bar{display:none;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:30}
      .icon-btn{background:#fff;border:1px solid var(--line2);color:var(--navy);border-radius:10px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;flex:none}
      .icon-btn:hover{border-color:var(--navy2)}
      .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
      .stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 2px 10px rgba(24,44,70,.05)}
      .stat-card .lab{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
      .stat-card .big{font-family:"IBM Plex Sans";font-size:1.7rem;margin-top:4px;color:var(--navy)}
      .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
      .three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
      .listing{border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 10px rgba(24,44,70,.05)}
      .listing:hover{border-color:var(--steel)}
      .listing h3{font-size:1rem}
      .match-score{font-family:"IBM Plex Sans";font-weight:800}
      .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
      .filters .field{margin:0;flex:1;min-width:150px}
      .drop{border:1.5px dashed var(--line2);border-radius:var(--radius);padding:26px;text-align:center;background:#fff;cursor:pointer}
      .drop:hover,.drop.over{border-color:var(--coral);background:#FDF0EE}
      .skill-row{display:grid;grid-template-columns:130px 1fr 52px;gap:12px;align-items:center;padding:.4rem 0}
      .skill-row .nm{font-weight:600;font-size:.92rem}
      .skill-row .pc{font-family:"IBM Plex Mono",monospace;font-size:.82rem;text-align:right;color:var(--muted)}
      .ms-item{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
      .ms-item:last-child{border-bottom:0}
      .ms-dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;flex:none;font-size:.8rem;font-weight:800;color:var(--muted);background:#fff}
      .ms-item.done .ms-dot{background:var(--good);border-color:var(--good);color:#fff}
      .check-row{display:flex;gap:.6rem;align-items:flex-start;padding:.4rem 0}
.task-course{margin:-.05rem 0 .4rem 1.65rem;font-size:.86rem}
.task-course a{color:var(--navy2);text-decoration:none;font-weight:700}
.task-course a:hover{color:var(--coral-d);text-decoration:underline}
.course-row{display:flex;gap:12px;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.course-row:last-child{border-bottom:0;padding-bottom:.1rem}
.course-row a{color:var(--navy);text-decoration:none;font-weight:600}
.course-row a:hover{color:var(--coral-d);text-decoration:underline}
.badge-cost{display:inline-flex;align-items:center;background:var(--card2);border:1px solid var(--line2);color:var(--muted);border-radius:6px;padding:.1rem .5rem;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.badge-cost.free{background:#E0F2E8;border-color:#A5D6BC;color:#1E7A4C}
      .check-row input[type="checkbox"]{width:20px;height:20px;margin-top:2px;accent-color:var(--coral);flex:none}
      .check-row.done span{text-decoration:line-through;color:var(--muted)}
      .q-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 2px 10px rgba(24,44,70,.05)}
      .q-meta{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
      .fb-box{border-radius:12px;padding:14px 16px;margin-top:14px;font-size:.93rem}
      .fb-box.good{background:#EAF6EF;border:1px solid #A5D6BC}
      .fb-box.mid{background:#FBF3DC;border:1px solid #E8CF92}
      .table-wrap{overflow-x:auto}
      table{border-collapse:collapse;width:100%;font-size:.92rem}
      th{text-align:left;color:var(--muted);font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;padding:.55rem .7rem;border-bottom:1px solid var(--line2)}
      td{padding:.65rem .7rem;border-bottom:1px solid var(--line);vertical-align:top}
      .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--navy);border:1px solid var(--navy2);color:#fff;padding:.65rem 1.1rem;border-radius:12px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:all .25s;z-index:90;box-shadow:var(--shadow);max-width:92vw;text-align:center}
      .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

      /* ---------- Chat coach ---------- */
      .chat-fab{position:fixed;right:20px;bottom:20px;z-index:80;width:58px;height:58px;border-radius:50%;background:var(--coral);border:0;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 32px rgba(219,91,77,.45)}
      .chat-fab:hover{background:var(--coral-d)}
      .chat-panel{position:fixed;right:20px;bottom:90px;z-index:80;width:min(392px,calc(100vw - 24px));height:min(560px,calc(100dvh - 120px));background:var(--card);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);display:none;flex-direction:column;overflow:hidden}
      .chat-panel.open{display:flex}
      .chat-head{display:flex;align-items:center;gap:.6rem;padding:13px 16px;background:var(--navy);color:#fff}
      .chat-head .muted,.chat-head .tiny{color:var(--steel)}
      .chat-head .avatar{width:32px;height:32px;font-size:.75rem;background:var(--coral)}
      .chat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
      .msg{max-width:86%;padding:.6rem .8rem;border-radius:14px;font-size:.92rem;line-height:1.5}
      .msg.bot{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
      .msg.me{background:var(--navy2);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
      .msg .go{display:inline-block;margin-top:8px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:inherit;border-radius:8px;padding:.3rem .6rem;font-size:.8rem;font-weight:700}
      .msg.bot .go{background:var(--paper);border-color:var(--line2);color:var(--navy2)}
      .chat-chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px;background:var(--paper)}

      .chat-input input{flex:1}

      .mic-btn.rec{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.2s infinite}

      .switch input{width:20px;height:20px;accent-color:var(--coral)}

      @media (max-width:900px){

        .skill-row{grid-template-columns:104px 1fr 44px}
      }
      @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  norm.split(" ").forEach(function(tok){

    });

  });
  return found;

function courseByTitle(t){ for(var i=0;i<COURSES.length;i++) if(COURSES[i].title===t) return COURSES[i]; return null; }
function matchCourse(text){
  var hay = " " + String(text||"").toLowerCase() + " ";
  for(var i=0;i<COURSES.length;i++){ var c = COURSES[i];
    for(var k=0;k<c.keywords.length;k++){ if(hay.indexOf(c.keywords[k])>-1) return c; } }
  return null;
}
function courseForSkill(skill){
  var t = SKILL_COURSE[skill];
  if(t) return courseByTitle(t);
  return matchCourse(skill + " " + resourcesFor(skill).join(" "));
}
function coursesForRoadmap(rm){
  var seen = {}, out = [];
  (rm.gaps||[]).forEach(function(s){ var c = courseForSkill(s); if(c && !seen[c.url]){ seen[c.url]=1; out.push({note:"for the " + s + " gap", course:c}); } });
  /* A full-coverage roadmap has no gaps to match courses against; its
     courses come from the deepen-a-strength tasks instead, so the
     courses card renders for those roadmaps too. */
  (rm.milestones||[]).forEach(function(ms){ (ms.tasks||[]).forEach(function(t){
    var c = t.course || null;
    if(c && t.skill && !seen[c.url]){ seen[c.url]=1; out.push({note:"deepen your " + t.skill, course:c}); }
  }); });
  return out;
}

var ACTION_VERBS = ["built","developed","designed","implemented","led","created","automated","improved","reduced","increased","launched","shipped","optimized","resolved","mentored","collaborated","analyzed","deployed","wrote","trained"];
function analyzeResume(text){
  var t = String(text||"");
  var low = t.toLowerCase();
  var skills = extractSkills(t);
  var has = {
    education: /education|university|college|b\.s\.|bachelor|gpa/.test(low),
    experience: /experience|intern|assistant|engineer at|worked|job/.test(low),
    projects: /project/.test(low),
    skillsSec: /skills/.test(low),
    contact: /@|github|linkedin|http/.test(low),
    certs: /certif|aws certified|coursera|certificate/.test(low)
  };
  var bullets = t.split(/\n/).filter(function(l){return /^[-•*]/.test(l.trim());}).length;
  var verbHits = ACTION_VERBS.filter(function(v){return low.indexOf(v)>-1;}).length;
  var quantified = (t.match(/\d+\s?(%|\+|x\b|users|students|hours|tickets|per week)/gi)||[]).length;
  var words = t.split(/\s+/).filter(Boolean).length;

  var score = 22;
  score += Math.min(skills.length*2.2, 26);
  if(has.education) score += 8;
  if(has.experience) score += 9;
  if(has.projects) score += 8;
  if(has.contact) score += 4;
  if(has.certs) score += 3;
  score += Math.min(verbHits*0.9, 7);
  score += Math.min(quantified*1.6, 8);
  if(words>=220 && words<=750) score += 5; else if(words>120) score += 2;
  score = Math.max(18, Math.min(97, Math.round(score)));

  var strengths=[], weaknesses=[], recs=[];
  if(skills.length>=8) strengths.push(skills.length + " recognizable technical skills detected (" + skills.slice(0,5).join(", ") + "…), which maps well to common ATS keyword filters.");
  if(has.projects) strengths.push("Projects section present — recruiters weight demonstrated work heavily for interns.");
  if(quantified>=2) strengths.push("Results are quantified in " + quantified + " places (numbers, %, scale), which makes impact easy to scan.");
  if(verbHits>=6) strengths.push("Strong action verbs throughout (" + ACTION_VERBS.filter(function(v){return low.indexOf(v)>-1;}).slice(0,4).join(", ") + "…), so bullets read as accomplishments, not duties.");
  if(has.experience) strengths.push("Work experience is listed, including relevant responsibilities.");
  if(!has.projects){ weaknesses.push("No Projects section found — for students, projects are the strongest proof of skill."); recs.push("Add a Projects section with 2–3 projects: name, tech stack, and one bullet with a measurable outcome each."); }
  if(!has.experience){ weaknesses.push("No work experience section detected."); recs.push("Add any experience — campus jobs, freelance, research, or a substantial class project framed as experience."); }
  if(!has.education){ weaknesses.push("Education section is missing or unclear."); recs.push("Add an Education section with school, degree, expected graduation, GPA (if 3.0+), and relevant coursework."); }
  if(quantified<2){ weaknesses.push("Few quantified results — bullets describe tasks more than impact."); recs.push("Quantify at least 3 bullets: users reached, % faster, tickets per week, team size, or dataset size."); }
  if(verbHits<5){ weaknesses.push("Bullets lean on weak verbs; only " + verbHits + " strong action verbs detected."); recs.push("Start every bullet with a strong verb: Built, Shipped, Automated, Reduced, Led."); }
  if(!has.certs){ weaknesses.push("No certifications listed."); recs.push("Consider one targeted certification (e.g., AWS Cloud Practitioner or a Google Cloud cert) if your target roles ask for cloud skills."); }
  if(skills.length<8){ weaknesses.push("Only " + skills.length + " skills detected — likely under-keyworded for ATS screening."); recs.push("Mirror the exact skill keywords from the postings you target (this platform's Match Analyzer shows which ones)."); }
  if(!has.contact){ weaknesses.push("No links detected (GitHub / LinkedIn / portfolio)."); recs.push("Add GitHub and LinkedIn URLs at the top — recruiters click through on most student resumes."); }
  if(strengths.length<2) strengths.push("The resume has a readable structure that the analyzer could parse end to end.");
  if(recs.length<3) recs.push("Tailor the skills section per application: reorder so the posting's top required skills appear first.");

  var sections = [
    {name:"Education", ok:has.education},
    {name:"Experience", ok:has.experience},
    {name:"Projects", ok:has.projects},
    {name:"Skills section", ok:has.skillsSec},
    {name:"Contact & links", ok:has.contact},
    {name:"Certifications", ok:has.certs}
  ];
  return { score:score, skills:skills, sections:sections, strengths:strengths, weaknesses:weaknesses, recommendations:recs,
           stats:{words:words, bullets:bullets, quantified:quantified, verbs:verbHits} };
}
function matchAgainst(resumeSkills, jobSkills){
  var matched = jobSkills.filter(function(s){return resumeSkills.indexOf(s)>-1;});
  var missing = jobSkills.filter(function(s){return resumeSkills.indexOf(s)===-1;});
  var score = jobSkills.length ? Math.round(matched.length/jobSkills.length*100) : 0;
  return { score:score, matched:matched, missing:missing };
}
function proficiency(skill, resumeText, analysis){
  /* Heuristic depth: mentions + context signals */
  var low = String(resumeText||"").toLowerCase();
  var aliases = (SKILL_DEFS.filter(function(d){return d[0]===skill;})[0]||[skill,[skill.toLowerCase()]])[1];
  var mentions = 0;
  aliases.forEach(function(a){ var i=low.indexOf(a); while(i>-1){ mentions++; i=low.indexOf(a,i+1);} });
  if(mentions>=4) return 85;
  if(mentions===3) return 72;
  if(mentions===2) return 58;
  if(mentions===1) return 40;
  return 0;
}
function buildRoadmap(gaps, targetRole, knownSkills){
  var steps = gaps.slice(0,6);
  var milestones = [];
  if(!steps.length){
    /* Full coverage: there are no gaps to close, so the plan deepens the
       skills the role already sees in the resume — and those tasks carry
       the same course links a gap plan gets, instead of a bare
       maintenance list with no courses at all. */
    var deepen = (knownSkills||[]).filter(function(s){ return !!courseForSkill(s); }).slice(0,3);
    var dtasks = [];
    deepen.forEach(function(s){
      dtasks.push({label:"Deepen " + s + " — start with: " + resourcesFor(s)[0], done:false, skill:s, course:courseForSkill(s)});
      dtasks.push({label:"Practice: " + resourcesFor(s)[1], done:false});
    });
    if(deepen.length) dtasks.push({label:"Project — " + projectFor(deepen[0]), done:false});
    if(dtasks.length) milestones.push({title:"Deepen your strengths", weeks:"Weeks 1–3", tasks:dtasks});
    milestones.push({title:"Polish & apply", weeks:deepen.length?"Weeks 4–5":"Ongoing", tasks:[
      {label:"Update your resume with the project outcomes and any new depth you can evidence", done:false},
      {label:"Re-run the Match Analyzer and aim for 80%+ on your target posting", done:false},
      {label:"Practice a mock interview for " + (targetRole||"your target role"), done:false},
      {label:"Apply to your top matches in Find Internships", done:false}
    ]});
    return { target:targetRole||"Target role", gaps:gaps, milestones:milestones, created:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) };
  }
  var phases = [
    {title:"Foundations", weeks:"Weeks 1–2"},
    {title:"Core skills", weeks:"Weeks 3–5"},
    {title:"Build & prove it", weeks:"Weeks 6–8"},
    {title:"Polish & apply", weeks:"Weeks 9–10"}
  ];
  var per = [[],[],[],[]];
  steps.forEach(function(s,i){ per[Math.min(3, Math.floor(i/Math.max(1,Math.ceil(steps.length/3))))].push(s); });
  phases.forEach(function(ph,pi){
    var tasks = [];
    per[pi].forEach(function(s){
      tasks.push({label:"Learn " + s + " — start with: " + resourcesFor(s)[0], done:false, skill:s, course:courseForSkill(s)});
      tasks.push({label:"Practice: " + resourcesFor(s)[1] || "", done:false});
    });
    if(pi===2) steps.slice(0,3).forEach(function(s){ tasks.push({label:"Project — " + projectFor(s), done:false}); });
    if(pi===3){ tasks.push({label:"Update your resume: add the new skills and the project outcomes", done:false}); tasks.push({label:"Re-run the Match Analyzer and aim for 80%+ on your target posting", done:false}); tasks.push({label:"Practice a mock interview for " + (targetRole||"your target role"), done:false}); }
    if(tasks.length) milestones.push({title:ph.title, weeks:ph.weeks, tasks:tasks.filter(function(x){return x.label;})});
  });
  if(!milestones.length) milestones.push({title:"Keep the edge", weeks:"Ongoing", tasks:[{label:"Your resume already covers the required skills — deepen one specialty skill", done:false},{label:"Practice a mock interview weekly", done:false},{label:"Apply to your top matches in Find Internships", done:false}]});
  return { target:targetRole||"Target role", gaps:gaps, milestones:milestones, created:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) };
}
function roadmapProgress(rm){
  var total=0, done=0;
  rm.milestones.forEach(function(m){ m.tasks.forEach(function(t){ total++; if(t.done) done++; }); });
  return total ? Math.round(done/total*100) : 0;
}

var QUESTION_BANK = {
  behavioral:[
    "Tell me about yourself and why you're interested in this role.",
    "Tell me about a time you worked on a team project that didn't go as planned. What happened and what did you do?",
    "Describe a time you had to learn something quickly to finish a task. How did you approach it?",
    "Tell me about a challenge in a project and how you overcame it.",
    "Why should we pick you for this internship over other candidates?"
  ],
  situational:[
    "Imagine you're two days from a deadline and realize a feature you own won't be finished. What do you do?",
    "A teammate disagrees with your technical approach in a code review. How do you handle it?",
    "You find a bug in production code you didn't write, right before a demo. Walk me through your next hour.",
    "Your manager gives you a task with unclear requirements. What are your first steps?"
  ],
  technicalGeneric:[
    "Walk me through a project on your resume that you're most proud of. What was your role and what did you build?",
    "How do you debug a problem when you have no idea where to start?",
    "Explain a technical concept you learned recently as if I were a new teammate.",
    "How do you decide what to work on first when everything feels urgent?"
  ]
};
function questionsFor(jobSkills, roleLabel){
  var qs = [];
  qs.push({type:"Behavioral", q:QUESTION_BANK.behavioral[0]});
  jobSkills.slice(0,3).forEach(function(s){
    qs.push({type:"Technical", q:"This role uses " + s + ". How have you used " + s + " so far, and what would you build with it in your first month here?"});
  });
  qs.push({type:"Technical", q:QUESTION_BANK.technicalGeneric[0]});
  qs.push({type:"Behavioral", q:QUESTION_BANK.behavioral[1]});
  qs.push({type:"Situational", q:QUESTION_BANK.situational[Math.floor(Math.random()*QUESTION_BANK.situational.length)]});
  if(jobSkills.length>3) qs.push({type:"Technical", q:"Which part of this stack is newest to you — and how would you get productive in it quickly?"});
  qs.push({type:"Behavioral", q:QUESTION_BANK.behavioral[4]});
  return qs.slice(0,7);
}
function gradeAnswer(answer, question, jobSkills){
  var a = String(answer||"").trim();
  var words = a.split(/\s+/).filter(Boolean).length;
  var low = a.toLowerCase();
  var score = 25;
  if(words>=40) score += 18; else if(words>=25) score += 12; else if(words>=12) score += 6;
  if(words>=90) score += 8;
  var star = 0;
  if(/situation|context|background|when |at my|during/.test(low)) star++;
  if(/task|goal|needed to|responsible|my job/.test(low)) star++;
  if(/i (built|led|created|decided|implemented|designed|wrote|fixed|organized|asked|researched)/.test(low)) star++;
  if(/result|outcome|improved|reduced|increased|%|users|learned|in the end|so that/.test(low)) star++;
  score += star*7;
  var skillHits = jobSkills.filter(function(s){ return low.indexOf(s.toLowerCase().split(" ")[0])>-1; }).length;
  score += Math.min(skillHits*4, 12);
  if(/example|for instance|project|internship|class|course/.test(low)) score += 6;
  score = Math.max(8, Math.min(97, score));
  var fb = [];
  if(words<25) fb.push("Too brief — aim for 120–200 words so the interviewer can judge your thinking. Use a real example.");
  if(star<=1) fb.push("Structure it with STAR: Situation, Task, Action, Result. Your answer is missing most of that arc.");
  else if(star<=3) fb.push("Good STAR bones — sharpen the Result with a number or a concrete outcome.");
  else fb.push("Strong STAR structure with a clear outcome.");
  if(skillHits===0 && jobSkills.length) fb.push("Name the tools from the posting (" + jobSkills.slice(0,3).join(", ") + ") where they honestly fit your story.");
  if(!/i (built|led|created|decided|implemented|designed|wrote|fixed)/.test(low)) fb.push("Use more first-person action language — interviewers score what *you* did, not what the team did.");
  var stronger = star<=2
    ? "A stronger version opens with the situation in one sentence, spends most of the answer on your specific actions, and closes with a measurable result plus what you learned."
    : "To make it stronger still, end with one sentence connecting this experience to this specific role.";
  return { score:score, feedback:fb, stronger:stronger, star:star, words:words };
}

function currentResumeSkills(){ return S.analysis ? S.analysis.skills : extractSkills(S.resumeText); }
function readinessScore(){
  if(!S.analysis) return null;
  var base = S.analysis.score;
  var best = bestMatchScore();
  var rm = S.roadmap ? roadmapProgress(S.roadmap) : 0;
  var iv = S.interviews.length ? Math.round(S.interviews.reduce(function(a,b){return a+b.score;},0)/S.interviews.length) : null;
  var v = base*0.55 + (best!=null?best:base)*0.25 + rm*0.1 + (iv!=null?iv:base)*0.1;
  return Math.round(v);
}
function bestMatchScore(){
  var skills = currentResumeSkills();
  if(!skills.length) return null;
  var best = 0;
  LISTINGS.forEach(function(l){ var m = matchAgainst(skills, l.skills); if(m.score>best) best=m.score; });
  return best;
}
function rankedListings(){
  var skills = currentResumeSkills();
  return LISTINGS.map(function(l){
    var m = matchAgainst(skills, l.skills);
    return {listing:l, match:m};
  }).sort(function(a,b){ return b.match.score - a.match.score; });
}

/* ---------------- Session persistence ----------------
   Sign-ins are stored redundantly — localStorage, a 90-day cookie, and
   sessionStorage — and restored from whichever store still has the
   session, rewriting it to the others. Accounts registered here are
   stored the same way, so a new account survives reloads too. Restore
   tries every store's copy (mobile browsers clear and corrupt the
   stores independently), and a session no copy can restore is cleared
   so the sign-in page always stays reachable. */
var SESSION_KEY = "hrp_session", USERS_KEY = "hrp_users";
function storeWrite(key, val){
  try{ localStorage.setItem(key, val); }catch(e){}
  try{ sessionStorage.setItem(key, val); }catch(e){}
  try{ document.cookie = key + "=" + encodeURIComponent(val) + "; max-age=" + (90*24*3600) + "; path=/; SameSite=Lax"; }catch(e){}
}
function storeReadAll(key){
  /* Every store's copy, not just the first non-empty one: on mobile the
     stores diverge (one gets cleared or corrupted while another keeps a
     good copy), and a single bad copy must not hide the good ones. */
  var out = [];
  function push(v){ if(v && out.indexOf(v)===-1) out.push(v); }
  try{ push(localStorage.getItem(key)); }catch(e){}
  try{ push(sessionStorage.getItem(key)); }catch(e){}
  try{ var m = document.cookie.match(new RegExp("(?:^|; )" + key + "=([^;]*)")); if(m) push(decodeURIComponent(m[1])); }catch(e){}
  return out;
}
function storeRead(key){ var all = storeReadAll(key); return all.length ? all[0] : null; }
function storeClear(key){
  try{ localStorage.removeItem(key); }catch(e){}
  try{ sessionStorage.removeItem(key); }catch(e){}
  try{ document.cookie = key + "=; max-age=0; path=/; SameSite=Lax"; }catch(e){}
}
function saveSession(u){ storeWrite(SESSION_KEY, JSON.stringify({ uid:u.id, email:u.email, role:u.role })); }
function clearSession(){ storeClear(SESSION_KEY); }
function persistUsers(){
  var reg = DB.users.filter(function(x){ return x.registered; });
  if(reg.length) storeWrite(USERS_KEY, JSON.stringify(reg)); else storeClear(USERS_KEY);
}
function restoreUsers(){
  /* Merge registered accounts from EVERY store's copy — any one valid
     copy is enough, and the merged set is written back to all stores. */
  var added = false;
  storeReadAll(USERS_KEY).forEach(function(raw){
    try{
      var arr = JSON.parse(raw);
      if(!arr || !arr.length) return;
      arr.forEach(function(u){
        if(u && u.email && !DB.users.some(function(x){ return x.email.toLowerCase()===String(u.email).toLowerCase() && x.role===u.role; })){ DB.users.push(u); added = true; }
      });
    }catch(e){ /* this copy is unusable — try the next store */ }
  });
  if(added) persistUsers();
}
function restoreSession(){
  var raws = storeReadAll(SESSION_KEY); if(!raws.length) return;
  for(var i=0;i<raws.length;i++){
    try{
      var data = JSON.parse(raws[i]);
      if(!data || !data.email) continue;
      var u = DB.users.filter(function(x){ return x.email.toLowerCase()===String(data.email).toLowerCase() && x.role===data.role; })[0];
      if(!u) continue;
      storeWrite(SESSION_KEY, raws[i]);
      S.user = u; S.chat = []; S.chatLoaded = false;
      resetResumeState();
      if(u.role==="student"){
        restoreResume(u);
        if(u.id==="u1" && !S.resumeText) loadSampleResume(false);
      }
      S.view = "dashboard";
      return;
    }catch(e){ /* this copy is unusable — try the next store */ }
  }
  /* No store held a restorable session (stale or corrupted saved data,
     e.g. left by an earlier build). Clear it everywhere so it can't trap
     the page on a restore-error screen, and fall through to the normal
     landing / sign-in flow. */
  clearSession();
}
function retryRestore(){ S.restoreError = null; restoreSession(); render(); }
function viewRestoreError(){
  return '<div class="wrap" style="max-width:520px;padding:64px 20px">'
    + '<div class="card"><h3 style="margin-bottom:8px">We couldn\'t restore your session</h3>'
    + '<p class="muted small" style="margin-bottom:16px">' + esc(S.restoreError || "Something went wrong restoring your saved sign-in.") + '</p>'
    + '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary btn-sm" onclick="retryRestore()">Try again</button>'
    + '<button class="btn btn-ghost btn-sm" onclick="signOut()">Sign out</button></div></div></div>';
}

/* ---------------- Saved resume (per account) ----------------
   A student's analyzed resume is stored under their own account key
   with the same redundant stores as the session (localStorage,
   sessionStorage, cookie), so the resume they uploaded is still here
   when they sign back in — in a later session, not just this one.
   Restore tries every store's copy, like the session restore, and the
   analysis is re-derived from the saved text so it always matches the
   current engine. Removing the resume clears the saved copy too. */
var RESUME_KEY_PREFIX = "hrp_resume_";
function resumeKey(u){ return RESUME_KEY_PREFIX + u.id; }
function saveResume(){
  var u = S.user; if(!u || u.role!=="student") return;
  if(S.resumeText) storeWrite(resumeKey(u), JSON.stringify({ text:S.resumeText, name:S.resumeName||"" }));
  else storeClear(resumeKey(u));
}
function restoreResume(u){
  if(!u || u.role!=="student") return false;
  var raws = storeReadAll(resumeKey(u));
  for(var i=0;i<raws.length;i++){
    try{
      var d = JSON.parse(raws[i]);
      if(d && d.text && String(d.text).trim().length>60){
        S.resumeText = String(d.text);
        S.resumeName = d.name || "";
        S.analysis = analyzeResume(S.resumeText);
        storeWrite(resumeKey(u), raws[i]);
        return true;
      }
    }catch(e){ /* this copy is unusable — try the next store */ }
  }
  return false;
}
function resetResumeState(){
  S.resumeText=""; S.resumeName=""; S.analysis=null; S.lastMatch=null;
}
function removeResume(){
  resetResumeState();
  saveResume();
  render();
}

function signIn(u){
  S.user = u; S.chat = []; S.chatLoaded = false;
  resetResumeState();
  saveSession(u);
  if(u.role==="student"){
    restoreResume(u);
    if(u.id==="u1" && !S.resumeText){ loadSampleResume(false); }
  }
  S.view = "dashboard";
  render();
}
function signOut(){ clearSession(); S.user=null; S.restoreError=null; resetResumeState(); S.view="landing"; render(); window.scrollTo(0,0); }

    + '<div class="stat-card"><div class="lab">Skills on your resume</div><div class="big">'+S.analysis.skills.length+'</div><p class="small muted">Across '+uniq(S.analysis.skills.map(skillCategory)).length+' categories</p></div>'

    + '<p class="small muted" style="margin-bottom:12px">'+esc(sourceLabel)+'</p>'
    + '<div class="two-col"><div class="card"><h3 style="margin-bottom:10px">Required skills — your proficiency</h3>'

  }

    + '<div class="field" style="margin-top:14px"><label for="iv-answer">Your answer</label><textarea id="iv-answer" rows="6" placeholder="Use STAR: Situation, Task, Action, Result. 120–200 words is a strong length…">'+esc(graded?graded.text:"")+'</textarea></div>'
    + (graded ? '<div class="fb-box '+(graded.grade.score>=70?"good":"mid")+'"><b>Score: '+graded.grade.score+'/100</b> · STAR elements found: '+graded.grade.star+'/4<ul class="list-clean" style="margin-top:4px">'+graded.grade.feedback.map(function(f){return '<li>'+esc(f)+'</li>';}).join("")+'</ul><p style="margin-top:6px"><b>Stronger answer:</b> '+esc(graded.grade.stronger)+'</p></div>' : '')

function interviewHistoryHTML(){
  if(!S.interviews.length) return '<p class="muted small">No completed sessions yet — your scores and improvement over time will appear here.</p>';
  return S.interviews.slice().reverse().map(function(iv){
    return '<div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)"><span class="match-score" style="color:'+scoreColor(iv.score)+';font-size:1.05rem">'+iv.score+'</span><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(iv.role)+'</div><div class="tiny muted">'+iv.count+' questions · '+esc(iv.when)+'</div></div></div>';
  }).join("");
}
function gradeCurrent(regrade){
  var sess = S.interviewSession; if(!sess) return;
  var text = document.getElementById("iv-answer").value;
  if(text.trim().split(/\s+/).filter(Boolean).length < 8){ toast("Give a fuller answer first — at least a couple of sentences."); return; }
  var g = gradeAnswer(text, sess.questions[sess.idx], sess.skills);
  sess.answers[sess.idx] = { q: sess.questions[sess.idx], text: text, grade: g };
  render();
}
function nextQuestion(){
  var sess = S.interviewSession; if(!sess) return;
  sess.idx++;
  if(sess.idx >= sess.questions.length){ finishSession(); }
  render();
  if(S.interviewSession && S.interviewSession.voice && S.interviewSession.questions[S.interviewSession.idx]) speakText(S.interviewSession.questions[S.interviewSession.idx].q);
}
function endSessionEarly(){
  var sess = S.interviewSession; if(!sess) return;
  if(sess.answers.filter(Boolean).length){ sess.idx = sess.questions.length; finishSession(); }
  else S.interviewSession = null;
  render();
}
function finishSession(){
  var sess = S.interviewSession; if(!sess) return;
  var done = sess.answers.filter(Boolean);
  if(done.length){
    var avg = Math.round(done.reduce(function(a,b){return a+b.grade.score;},0)/done.length);
    S.interviews.push({ role: sess.role, score: avg, count: done.length, when: new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"}) + ", " + new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}) });
  }
}

function savePosting(){
  var title = (document.getElementById("pf-title").value||"").trim();
  var err = document.getElementById("pf-err");
  if(!title){ err.textContent = "Give the posting a title first."; err.style.display="block"; return; }
  var req = pickedSkills("pf-required");
  if(!req.length){ err.textContent = "Pick at least one required skill — that's what candidates get ranked on."; err.style.display="block"; return; }
  var data = { title:title, desc:document.getElementById("pf-desc").value, required:req, preferred:pickedSkills("pf-preferred"),
    education:document.getElementById("pf-edu").value, experience:document.getElementById("pf-exp").value, other:document.getElementById("pf-other").value };
  if(S.editingPosting){
    var p = DB.postings.filter(function(x){return x.id===S.editingPosting;})[0];
    Object.keys(data).forEach(function(k){ p[k]=data[k]; });
    toast("Posting updated");
  } else {
    data.id = "P"+Date.now(); data.company = S.user.company||"My Company"; data.status = "Open"; data.sample = false;
    DB.postings.unshift(data);
    toast("Posting published — candidates are already ranked against it");
  }
  S.view = "candidates"; S.candFilter.posting = S.editingPosting || data.id; S.editingPosting = null;
  render(); window.scrollTo(0,0);
}
function viewCandidates(){
  var f = S.candFilter;
  var pool = candidatePool();
  var posting = f.posting ? DB.postings.filter(function(p){return p.id===f.posting;})[0] : null;
  var rows = pool.map(function(c){
    var fit = null;
    if(posting){
      var rm = matchAgainst(c.skills, posting.required);
      var pm = matchAgainst(c.skills, posting.preferred);
      fit = Math.round(rm.score*0.75 + (posting.preferred.length ? pm.score*0.25 : rm.score*0.25));
      fit = { score:fit, matched:rm.matched, missing:rm.missing, prefMatched:pm.matched };
    }
    return { c:c, fit:fit };
  });
  rows.sort(function(a,b){ return posting ? (b.fit.score - a.fit.score || b.c.score - a.c.score) : (b.c.score - a.c.score); });
  if(f.q){ var q = f.q.toLowerCase(); rows = rows.filter(function(r){ return (r.c.name+" "+r.c.school+" "+r.c.target+" "+r.c.skills.join(" ")).toLowerCase().indexOf(q)>-1; }); }
  var h = pageHead("Candidates", posting ? "Ranked against “" + esc(posting.title) + "” — required skills weigh most." : "Every discoverable candidate, ranked by resume strength. Pick a posting to rank them against its qualifications instead.");
  h += '<div class="filters"><div class="field"><label for="c-posting">Rank against posting</label><select id="c-posting" onchange="S.candFilter.posting=this.value;render()"><option value="">No posting — resume strength</option>'
    + DB.postings.map(function(p){ return '<option value="'+p.id+'" '+(f.posting===p.id?"selected":"")+'>'+esc(p.title)+' ('+p.status+')</option>'; }).join("") + '</select></div>'
    + '<div class="field" style="flex:2"><label for="c-q">Search name, school, target role, or skill</label><input id="c-q" placeholder="e.g. React, MIT, data…" value="'+esc(f.q)+'" oninput="S.candFilter.q=this.value;refreshCandList()"></div></div>'
    + '<div id="cand-list">' + candListHTML(rows, posting) + '</div>';
  return h;
}

/* ---------------- Voice (Web Speech API) ---------------- */
function speakText(text){
  try{
    if(!("speechSynthesis" in window)){ toast("Speech isn't supported in this browser — try Chrome."); return; }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text).slice(0, 600));
    u.rate = 1.02;
    window.speechSynthesis.speak(u);
  }catch(e){ toast("Couldn't play speech in this browser."); }
}
var activeRec = null;
var lastDictate = null;
function micPolicyBlocked(){
  try{
    if(document.permissionsPolicy && document.permissionsPolicy.allowsFeature) return !document.permissionsPolicy.allowsFeature("microphone");
    if(document.featurePolicy && document.featurePolicy.allowsFeature) return !document.featurePolicy.allowsFeature("microphone");
  }catch(e){}
  return false;
}
function micPermissionState(cb){
  try{
    if(navigator.permissions && navigator.permissions.query){
      navigator.permissions.query({name:"microphone"}).then(function(st){ cb(st.state); }, function(){ cb(null); });
      return;
    }
  }catch(e){}
  cb(null);
}
function showMicHelp(kind){
  var root = document.getElementById("mic-help-root");
  if(!root) return;
  var title, body;
  if(kind === "blocked"){
    title = "Microphone is blocked for this site";
    body = '<p>Chrome saved a <b>Block</b> for this site, so it never shows the permission prompt again until you reset it:</p>'
      + '<ol class="mic-steps"><li>Click the <b>tune / lock icon</b> at the left of the address bar.</li><li>Open <b>Site settings</b>.</li><li>Find <b>Microphone</b> and set it to <b>Allow</b> — or click <b>Reset permissions</b>.</li><li>Come back here and tap <b>Try again</b>.</li></ol>';
  } else if(kind === "frame"){
    title = "This embedded view can't ask for the mic";
    body = '<p>The page is running inside an embedded frame that is not allowed to request microphone access, so Chrome blocks the request before the prompt can appear.</p>'
      + '<p>Open this demo in a <b>full browser tab</b> of its own, and the Allow prompt will appear when you tap the mic.</p>';
  } else if(kind === "nodevice"){
    title = "No microphone found";
    body = '<p>Chrome could not find a microphone on this device. Plug one in or check the system sound settings, then try again. Typing your answer works everywhere.</p>';
  } else if(kind === "busy"){
    title = "Microphone is busy";
    body = '<p>Another app or tab is using the microphone right now. Close it, then tap <b>Try again</b>.</p>';
  } else if(kind === "unsupported"){
    title = "Voice input isn't supported here";
    body = '<p>This browser does not offer speech recognition. Voice input works in <b>Chrome</b> or <b>Edge</b> on desktop — typing works in every browser.</p>';
  } else {
    title = "Microphone permission was not granted";
    body = '<p>The permission request was dismissed or denied, so voice input could not start. Tap <b>Try again</b> and choose <b>Allow</b> when Chrome asks.</p>';
  }
  root.innerHTML = '<div class="mic-scrim" id="mic-scrim"><div class="mic-card" role="dialog" aria-modal="true" aria-label="Microphone help">'
    + '<div style="display:flex;align-items:flex-start;gap:10px"><h3 style="flex:1;font-size:1.05rem">'+title+'</h3><button class="icon-btn" id="mic-help-close" aria-label="Close">'+ic("x",16)+'</button></div>'
    + '<div class="small" style="color:var(--muted);margin-top:10px;display:grid;gap:8px">'+body+'</div>'
    + '<div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="btn btn-primary btn-sm" id="mic-help-retry">Try again</button><button class="btn btn-ghost btn-sm" id="mic-help-dismiss">Type instead</button></div>'
    + '</div></div>';
  var close = function(){ root.innerHTML = ""; };
  document.getElementById("mic-help-close").onclick = close;
  document.getElementById("mic-help-dismiss").onclick = close;
  document.getElementById("mic-scrim").onclick = function(e){ if(e.target === this) close(); };
  document.getElementById("mic-help-retry").onclick = function(){ close(); if(lastDictate) dictateInto(lastDictate[0], lastDictate[1]); };
}
function startRecognition(textareaId, btnId){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var ta = document.getElementById(textareaId); if(!ta) return;
  var rec = new SR(); rec.lang = "en-US"; rec.interimResults = true; rec.continuous = false;
  var btn = document.getElementById(btnId); if(btn) btn.classList.add("rec");
  var base = ta.value;
  rec.onresult = function(ev){
    var txt = "";
    for(var i=0;i<ev.results.length;i++) txt += ev.results[i][0].transcript;
    ta.value = (base ? base.replace(/\s+$/,"") + " " : "") + txt;
  };
  rec.onend = function(){ activeRec = null; if(btn) btn.classList.remove("rec"); };
  rec.onerror = function(ev){
    activeRec = null; if(btn) btn.classList.remove("rec");
    var err = ev && ev.error ? ev.error : "";
    if(err === "not-allowed" || err === "service-not-allowed"){
      micPermissionState(function(state){
        if(state === "denied") showMicHelp("blocked");
        else if(micPolicyBlocked()) showMicHelp("frame");
        else showMicHelp("denied");
      });
    }
    else if(err === "audio-capture"){ showMicHelp("nodevice"); }
    else if(err === "no-speech"){ toast("Didn't hear anything — try again and speak a little closer to the mic."); }
    else if(err === "network"){ toast("Speech recognition needs a network connection — typing works offline."); }
    else if(err === "aborted"){ /* stopped by the user */ }
    else { toast("Mic didn't catch that — check permission and try again."); }
  };
  activeRec = rec;
  try{ rec.start(); }catch(e){ activeRec=null; if(btn) btn.classList.remove("rec"); }
}
function requestMicThenStart(textareaId, btnId){
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    showMicHelp(window.isSecureContext === false ? "frame" : "unsupported");
    return;
  }
  /* Explicit getUserMedia request first, so Chrome's Allow prompt appears
     before speech recognition starts instead of failing silently. */
  navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
    stream.getTracks().forEach(function(t){ t.stop(); });
    startRecognition(textareaId, btnId);
  }).catch(function(err){
    var name = err && err.name ? err.name : "";
    if(name === "NotFoundError" || name === "DevicesNotFoundError" || name === "OverconstrainedError"){ showMicHelp("nodevice"); return; }
    if(name === "NotReadableError" || name === "TrackStartError"){ showMicHelp("busy"); return; }
    if(name === "SecurityError"){ showMicHelp("frame"); return; }
    /* NotAllowedError: stored Block, embedded-frame policy, or dismissed prompt */
    if(micPolicyBlocked()){ showMicHelp("frame"); return; }
    micPermissionState(function(state){
      if(state === "denied") showMicHelp("blocked");
      else showMicHelp("denied");
    });
  });
}
function dictateInto(textareaId, btnId){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ showMicHelp("unsupported"); return; }
  var ta = document.getElementById(textareaId); if(!ta) return;
  if(activeRec){ try{ activeRec.stop(); }catch(e){} activeRec = null; return; }
  lastDictate = [textareaId, btnId];
  if(micPolicyBlocked()){ showMicHelp("frame"); return; }
  micPermissionState(function(state){
    if(state === "denied"){ showMicHelp("blocked"); return; }
    requestMicThenStart(textareaId, btnId);
  });
}

function coachReply(qRaw){
  var q = qRaw.toLowerCase();
  var u = S.user;
  if(u.role==="recruiter"){
    var pool = candidatePool();
    if(/best|top|strongest|who/.test(q)){
      var posting = DB.postings.filter(function(p){return p.status==="Open";})[0];
      if(posting){
        var rows = pool.map(function(c){ var rm = matchAgainst(c.skills, posting.required); var pm = matchAgainst(c.skills, posting.preferred); return {c:c, fit:Math.round(rm.score*0.75+(posting.preferred.length?pm.score*0.25:rm.score*0.25))}; }).sort(function(a,b){return b.fit-a.fit;});
        var t = rows[0];
        return { text:"Against “" + posting.title + "”, your best fit is " + t.c.name + " at " + t.fit + "% — " + t.c.target + " at " + t.c.school + ". " + rows[1].c.name + " (" + rows[1].fit + "%) and " + rows[2].c.name + " (" + rows[2].fit + "%) follow. The full ranked list is on the Candidates page.", go:"candidates", goLabel:"See ranked candidates" };
      }
      var top = pool.slice().sort(function(a,b){return b.score-a.score;})[0];
      return { text:"By raw resume strength, " + top.name + " leads the pool at " + top.score + "/100 (" + top.target + ", " + top.school + "). Publish a posting and I'll rank everyone against its exact qualifications.", go:"postings", goLabel:"Open postings" };
    }
    if(/posting|write|describe|qualification/.test(q)) return { text:"A strong posting separates required skills (must-haves — candidates are ranked mostly on these) from preferred skills (tie-breakers). Add education and experience expectations, then check Candidates — the list re-ranks instantly.", go:"posting-form", goLabel:"Create a posting" };
    if(/how many|candidates|pool/.test(q)) return { text:"There are " + pool.length + " discoverable candidates right now across software, data, ML, quant, hardware, product, mobile, DevOps, analytics, and security. Students only appear if they opted in, and contact details stay private.", go:"candidates", goLabel:"Browse candidates" };
    if(/rare|missing|hard to find|supply/.test(q)){
      var counts = {}; pool.forEach(function(c){ c.skills.forEach(function(s){ counts[s]=(counts[s]||0)+1; }); });
      var rare = Object.keys(counts).sort(function(a,b){return counts[a]-counts[b];}).slice(0,4);
      return { text:"The rarest skills in the current pool are " + rare.join(", ") + " — few candidates list them, so postings requiring them will have short lists. The deepest benches are in Python, SQL, and JavaScript.", go:"candidates", goLabel:"Explore the pool" };
    }
    return { text:"I can rank candidates against any posting, explain what makes a posting attract stronger matches, or summarize the pool. Try “Who is my best candidate?” — or open Candidates to browse everyone.", go:"candidates", goLabel:"Open Candidates" };
  }
  /* student coach */
  if(!S.analysis){
    if(/internship|job|listing|browse/.test(q)) return { text:"You can browse all " + LISTINGS.length + " listings right now, but they'll be unranked. Analyze your resume first and the same page sorts itself by your personal fit — that's the magic step.", go:"find", goLabel:"Browse listings" };
    if(/how|work|start/.test(q)) return { text:"The pipeline is: resume analysis → internship matching → skill gaps → a learning roadmap → mock interviews. Everything feeds one readiness score on your dashboard. It starts with your resume.", go:"resume", goLabel:"Analyze my resume" };
    return { text:"Let's start with your resume — once it's analyzed I can rank internships for you, name your exact skill gaps, and build your roadmap. It takes ten seconds with the sample resume.", go:"resume", goLabel:"Analyze my resume" };
  }
  var ranked = rankedListings(); var best = ranked[0];
  var gaps = S.lastMatch ? S.lastMatch.missing : best.match.missing;
  if(/next|do|should|start|plan/.test(q)){
    if(gaps.length && !S.roadmap) return { text:"Your highest-leverage move: close the gap on " + gaps.slice(0,3).join(", ") + " — those are what your best matches ask for that your resume doesn't show yet. I can turn them into a week-by-week roadmap now.", go:"roadmap", goLabel:"Build my roadmap" };
    if(S.roadmap && roadmapProgress(S.roadmap)<100) return { text:"Keep going on your roadmap — you're at " + roadmapProgress(S.roadmap) + "%. After that, re-run the Match Analyzer: your score on “" + best.listing.role + "” should climb past " + best.match.score + "%.", go:"roadmap", goLabel:"Continue roadmap" };
    if(!S.interviews.length) return { text:"Your profile is strong on paper — now rehearse. A 10-minute mock interview for " + best.listing.role + " at " + best.listing.company + " is the best next step.", go:"interview", goLabel:"Start a mock interview" };
    return { text:"You're in great shape: readiness " + readinessScore() + ", roadmap done, interviews practiced. Time to apply — start with " + best.listing.company + " (" + best.match.score + "% match).", go:"find", goLabel:"See my matches" };
  }
  if(/best match|match|internship|job|apply/.test(q)) return { text:"Your best match is " + best.listing.role + " at " + best.listing.company + " — " + best.match.score + "% fit, based on " + best.match.matched.length + " matched skills" + (best.match.missing.length ? ". The gaps: " + best.match.missing.slice(0,3).join(", ") + "." : " with full skill coverage.") + " Your top 3 are on your dashboard.", go:"find", goLabel:"See all my matches" };
  if(/missing|gap|skill|learn|improve/.test(q)) return { text:"Against your best matches you're missing: " + (gaps.length ? gaps.join(", ") : "nothing — full coverage") + ". Each one maps to a concrete project in your roadmap (e.g., " + (gaps[0] ? projectFor(gaps[0]) : "deepen a specialty skill") + ").", go:"skills", goLabel:"Open Skill Gap Dashboard" };
  if(/ready|score|chance/.test(q)) return { text:"Your readiness score is " + readinessScore() + "/100: resume " + S.analysis.score + ", best match " + best.match.score + "%, roadmap " + (S.roadmap?roadmapProgress(S.roadmap):0) + "%" + (S.interviews.length ? ", last interview " + S.interviews[S.interviews.length-1].score : ", no interviews yet — that's the cheapest points available") + ". Above 75, students here are genuinely competitive for their top matches.", go:"dashboard", goLabel:"See my dashboard" };
  if(/interview|practice|nervous/.test(q)) return { text:"Mock interviews here use the real skill list of the role you're targeting, and grade you on STAR structure, relevance, and completeness — typed or by voice. Your " + (S.interviews.length ? "last score was " + S.interviews[S.interviews.length-1].score + "/100" : "first session is the best baseline you'll get") + ".", go:"interview", goLabel:"Practice now" };
  if(/resume|cv|ats/.test(q)) return { text:"Your resume scores " + S.analysis.score + "/100 with " + S.analysis.skills.length + " skills detected. The fastest wins from your analysis: " + (S.analysis.recommendations[0]||"keep tailoring keywords per posting"), go:"resume", goLabel:"Open my analysis" };
  if(/roadmap|plan|study/.test(q)) return { text: S.roadmap ? "Your roadmap for " + S.roadmap.target + " is " + roadmapProgress(S.roadmap) + "% complete. Consistency beats intensity — one task a day finishes it in about two weeks." : "No roadmap yet. Say the word and I'll build one from the gaps in your best match.", go:"roadmap", goLabel:"Open my roadmap" };
  if(/hello|hi|hey/.test(q)) return { text:"Hey " + u.name.split(" ")[0] + "! Readiness is " + readinessScore() + " and your best match is " + best.listing.company + " at " + best.match.score + "%. Want your next step, your gaps, or interview practice?", go:"dashboard", goLabel:"Open dashboard" };
  return { text:"Here's where you stand: resume " + S.analysis.score + "/100, best match " + best.listing.company + " (" + best.match.score + "%), readiness " + readinessScore() + ". Ask me “what should I do next?”, “what am I missing?”, or “am I ready to apply?” and I'll give you the specific answer for your profile.", go:"dashboard", goLabel:"Open dashboard" };
}
function coachAsk(text){
  S.chat.push({ from:"me", text:text });
  var r = coachReply(text);
  S.chat.push({ from:"bot", text:r.text, go:r.go, goLabel:r.goLabel });
  renderChat();
  if(S.speakReplies) speakText(r.text);
}

/* ---------------- View bindings (file upload / PDF) ---------------- */
function bindView(){
  var dz = document.getElementById("drop-zone");
  var fi = document.getElementById("resume-file");
  if(dz && fi){
    dz.addEventListener("click", function(){ fi.click(); });
    dz.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fi.click(); } });
    dz.addEventListener("dragover", function(e){ e.preventDefault(); dz.classList.add("over"); });
    dz.addEventListener("dragleave", function(){ dz.classList.remove("over"); });
    dz.addEventListener("drop", function(e){ e.preventDefault(); dz.classList.remove("over"); if(e.dataTransfer.files.length) readResumeFile(e.dataTransfer.files[0]); });
    fi.addEventListener("change", function(){ if(fi.files.length) readResumeFile(fi.files[0]); });
  }
  var rt = document.getElementById("resume-text");
  if(rt){
    rt.addEventListener("input", function(){
      if(S.resumeName && rt.value.trim() !== String(S.resumeText||"").trim()){
        S.resumeName = "";
        var lbl = document.getElementById("resume-file-label");
        if(lbl) lbl.style.display = "none";
      }
    });
  }
  var pre = document.getElementById("iv-voice-pre");
  if(pre){ pre.addEventListener("change", function(){ if(S.interviewSession) S.interviewSession.voice = pre.checked; }); }
}
function readResumeFile(file){
  S.resumeName = file.name;
  if(/\.pdf$/i.test(file.name)){
    toast("Reading your PDF…");
    extractPdfText(file).then(function(text){
      if(text && text.trim().length>60){ S.resumeText = text; S.analysis = analyzeResume(text); saveResume(); render(); toast("PDF analyzed — score " + S.analysis.score + "/100"); }
      else { S.resumeText = ""; S.resumeName = ""; saveResume(); render(); toast("Couldn't extract text from that PDF — paste the text instead, or try the sample."); }
    }).catch(function(){ render(); toast("PDF reading isn't available here — paste the text instead, or try the sample."); });
  } else {
    var r = new FileReader();
    r.onload = function(){ S.resumeText = String(r.result||""); S.analysis = analyzeResume(S.resumeText); saveResume(); render(); toast("Resume analyzed — score " + S.analysis.score + "/100"); };
    r.readAsText(file);
  }
}
function extractPdfText(file){
  return new Promise(function(resolve, reject){
    function go(){
      try{
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        file.arrayBuffer().then(function(buf){
          window.pdfjsLib.getDocument({ data: buf }).promise.then(function(pdf){
            var pages = [];
            var chain = Promise.resolve();
            for(var i=1;i<=pdf.numPages;i++){
              (function(n){ chain = chain.then(function(){ return pdf.getPage(n).then(function(page){ return page.getTextContent().then(function(tc){ pages.push(tc.items.map(function(it){ return it.str; }).join(" ")); }); }); }); })(i);
            }
            chain.then(function(){ resolve(pages.join("\n")); }).catch(reject);
          }).catch(reject);
        }).catch(reject);
      }catch(e){ reject(e); }
    }
    if(window.pdfjsLib) go();
    else {
      var s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      s.onload = go; s.onerror = reject;
      document.head.appendChild(s);
    }
  });
}
